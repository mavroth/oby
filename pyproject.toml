[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oby"
version = "0.2.1"
description = "Record a stealth browser session as a HAR, including the JavaScript that ran."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mavroth" }]
dependencies = [
  # 0.7 refuses to start its free browser without a license key.
  "cloakbrowser>=0.6,<0.7",
  "playwright>=1.64",
  "mcp>=1.20",
  "mitmcloak>=0.1",
  "cursory>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
GitHub = "https://github.com/mavroth/oby"

[project.scripts]
oby = "oby.__main__:main"

[tool.setuptools.packages.find]
include = ["oby*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
